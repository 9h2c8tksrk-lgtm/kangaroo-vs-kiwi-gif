<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<style>
  .a{transform-box:fill-box;animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  #roo{animation-name:rooMove}
  #kiwi{animation-name:kiwiHit;transform-origin:0 0;transform-box:view-box}
  #punch{animation-name:punch;transform-origin:30px -92px;transform-box:view-box}
  #leg{animation-name:legs;transform-origin:0 -50px;transform-box:view-box}
  #fist{animation-name:fistUp;transform-origin:30px -92px;transform-box:view-box}
  #stars{animation-name:stars}
  #ko{animation-name:ko}
  #cheer{animation-name:cheer;transform-origin:30px -92px;transform-box:view-box}
  @keyframes rooMove{
    0%{transform:translate(0,0)}
    14%{transform:translate(190px,0)}
    20%,24%{transform:translate(200px,0)}
    28%{transform:translate(215px,0)}
    40%{transform:translate(215px,0)}
    50%{transform:translate(225px,-30px)}
    55%{transform:translate(230px,0)}
    66%{transform:translate(330px,-130px)}
    74%,94%{transform:translate(475px,-66px)}
    100%{transform:translate(475px,-66px)}
  }
  @keyframes punch{
    0%,17%{transform:rotate(0)}
    20%{transform:rotate(-70deg)}
    23%,31%{transform:rotate(0)}
    34%{transform:rotate(-70deg)}
    37%,100%{transform:rotate(0)}
  }
  @keyframes fistUp{
    0%,74%{transform:rotate(0)}
    78%,100%{transform:rotate(-120deg)}
  }
  @keyframes cheer{0%,100%{transform:rotate(0)}}
  @keyframes legs{0%,100%{transform:rotate(0)}50%{transform:rotate(0)}}
  @keyframes kiwiHit{
    0%,19%{transform:translate(0,0) rotate(0)}
    22%{transform:translate(25px,0) rotate(12deg)}
    26%,32%{transform:translate(0,0) rotate(0)}
    36%{transform:translate(30px,-5px) rotate(18deg)}
    41%{transform:translate(5px,0) rotate(0)}
    50%{transform:translate(50px,-90px) rotate(40deg)}
    57%{transform:translate(60px,0) rotate(88deg)}
    60%,100%{transform:translate(60px,-34px) rotate(90deg)}
  }
  @keyframes stars{
    0%,19%{opacity:0}21%,25%{opacity:1}28%,34%{opacity:0}36%,40%{opacity:1}44%,55%{opacity:0}
    57%,70%{opacity:1}74%,100%{opacity:0}
  }
  @keyframes ko{0%,74%{opacity:0;transform:scale(.3)}80%,94%{opacity:1;transform:scale(1)}100%{opacity:1}}
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ec2f2"/><stop offset="1" stop-color="#d8f1ff"/></linearGradient>
</defs>
<rect width="800" height="450" fill="url(#sky)"/>
<rect y="360" width="800" height="90" fill="#2e9b43"/>
<g stroke="#fff" stroke-width="3" opacity=".6"><line x1="0" y1="400" x2="800" y2="400"/><line x1="400" y1="360" x2="400" y2="450"/></g>
<g stroke="#fff" stroke-width="6"><line x1="60" y1="360" x2="60" y2="170"/><line x1="100" y1="360" x2="100" y2="170"/><line x1="60" y1="215" x2="100" y2="215"/></g>
<text x="400" y="50" font-family="Arial Black,Impact,sans-serif" font-size="30" font-weight="900" fill="#fff" stroke="#0a3d6b" stroke-width="1.5" text-anchor="middle">AUSTRALIA vs NEW ZEALAND</text>

<!-- Kiwi (right) -->
<g transform="translate(560,360)">
 <g id="kiwi" class="a">
  <ellipse cx="0" cy="-45" rx="34" ry="38" fill="#7a5230"/>
  <path d="M-30,-60 Q0,-20 30,-60 L30,-35 Q0,-5 -30,-35Z" fill="#111"/>
  <rect x="-30" y="-48" width="60" height="7" fill="#fff" opacity=".9"/>
  <circle cx="-20" cy="-90" r="20" fill="#8a6038"/>
  <path d="M-36,-92 L-85,-80 L-36,-84Z" fill="#f2c14e"/>
  <circle cx="-24" cy="-96" r="5" fill="#fff"/><circle cx="-25" cy="-96" r="2.2" fill="#000"/>
  <path d="M-32,-106 L-20,-100" stroke="#000" stroke-width="2.5"/>
  <g stroke="#f2c14e" stroke-width="5" stroke-linecap="round"><line x1="-8" y1="-8" x2="-8" y2="0"/><line x1="10" y1="-8" x2="10" y2="0"/><line x1="-14" y1="0" x2="-2" y2="0"/><line x1="4" y1="0" x2="16" y2="0"/></g>
  <path d="M-4,-70 Q-20,-55 -8,-45" stroke="#7a5230" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g id="stars" class="a" style="animation-name:stars" fill="#ffd400" stroke="#c77a00" stroke-width="1.5" font-size="22">
   <text x="-55" y="-125">★</text><text x="-10" y="-135">★</text><text x="25" y="-115">★</text>
  </g>
 </g>
</g>

<!-- Kangaroo (left) -->
<g transform="translate(150,360)">
 <g id="roo" class="a">
  <path d="M-30,-40 Q-85,-30 -95,0 Q-60,-5 -25,-20Z" fill="#c9833a"/>
  <path d="M-25,-45 Q-30,-120 5,-125 Q40,-120 35,-45 Q30,-15 5,-15 Q-20,-15 -25,-45Z" fill="#d9954a"/>
  <path d="M-24,-85 Q5,-70 33,-85 L35,-45 Q30,-15 5,-15 Q-20,-15 -24,-45Z" fill="#0a7d3c"/>
  <path d="M-24,-70 Q5,-55 34,-70 L34,-60 Q5,-45 -24,-60Z" fill="#ffc72c"/>
  <circle cx="5" cy="-140" r="22" fill="#d9954a"/>
  <path d="M10,-132 Q42,-135 48,-125 Q42,-115 12,-118Z" fill="#e8b078"/>
  <ellipse cx="46" cy="-128" rx="5" ry="3.5" fill="#222"/>
  <path d="M-4,-158 L-14,-195 L8,-162Z" fill="#d9954a"/><path d="M10,-160 L16,-198 L26,-158Z" fill="#d9954a"/>
  <circle cx="22" cy="-146" r="5.5" fill="#fff"/><circle cx="24" cy="-146" r="2.5" fill="#000"/>
  <path d="M14,-156 L30,-150" stroke="#000" stroke-width="3"/>
  <ellipse cx="-5" cy="-12" rx="30" ry="9" fill="#c9833a"/><ellipse cx="25" cy="-4" rx="30" ry="7" fill="#c9833a" transform="translate(0,0)"/>
  <ellipse cx="25" cy="-4" rx="32" ry="7" fill="#a86a28"/>
  <g id="punch" class="a">
   <path d="M20,-95 L58,-92" stroke="#d9954a" stroke-width="13" stroke-linecap="round"/>
   <circle cx="66" cy="-92" r="13" fill="#d22" stroke="#800" stroke-width="2"/>
  </g>
  <path d="M-15,-95 L-28,-70" stroke="#d9954a" stroke-width="11" stroke-linecap="round"/>
  <circle cx="-30" cy="-66" r="10" fill="#d22" stroke="#800" stroke-width="2"/>
 </g>
</g>

<!-- impact words -->
<g font-family="Arial Black,Impact,sans-serif" font-weight="900" text-anchor="middle" stroke="#000" stroke-width="2">
 <text x="470" y="200" font-size="44" fill="#ff3b30" style="animation:w1 10s infinite">POW!</text>
 <text x="470" y="170" font-size="44" fill="#ffd400" style="animation:w2 10s infinite">BAM!</text>
 <text x="560" y="180" font-size="52" fill="#ff7a00" style="animation:w3 10s infinite">WHAM!</text>
 <text x="400" y="120" font-size="56" fill="#fff" stroke="#c00" stroke-width="3" style="animation:w4 10s infinite;" class="">GAME OVER! 🏉</text>
</g>
<style>
 @keyframes w1{0%,19%{opacity:0}20%,26%{opacity:1}28%,100%{opacity:0}}
 @keyframes w2{0%,33%{opacity:0}34%,40%{opacity:1}42%,100%{opacity:0}}
 @keyframes w3{0%,48%{opacity:0}50%,58%{opacity:1}60%,100%{opacity:0}}
 @keyframes w4{0%,76%{opacity:0}80%,95%{opacity:1}100%{opacity:0}}
</style>
</svg>
